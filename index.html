<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>광역 변성 작용 시뮬레이터 (최종 수정)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            color: white;
            font-family: 'Pretendard', sans-serif;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
            opacity: 0.6;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            transform: scaleX(-1);
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 3;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            pointer-events: none;
        }
        h1 { margin: 0 0 10px 0; font-size: 24px; }
        #rock-name { font-size: 32px; font-weight: bold; color: #a0a0a0; margin-bottom: 10px; }
        #pressure-bar-container {
            width: 300px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
        }
        #pressure-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #ff9800, #f44336);
            transition: width 0.1s;
        }
        #notification-msg {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            z-index: 3;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            color: #ffeb3b;
            pointer-events: none;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        <div id="ui-layer">
            <h1>지구과학: 광역 변성 작용</h1>
            <div id="rock-name">셰일 (Shale) - 대기 중</div>
            <div>압력 (Pressure)</div>
            <div id="pressure-bar-container">
                <div id="pressure-bar"></div>
            </div>
        </div>
        <div id="notification-msg">양손을 화면에 띄워주세요!</div>
    </div>
    <script>
        const videoElement = document.getElementById('video');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const rockNameEl = document.getElementById('rock-name');
        const pressureBarEl = document.getElementById('pressure-bar');
        const notificationEl = document.getElementById('notification-msg');
        const ROCK_RADIUS = 150; // 암석 크기 고정
        let pressure = 0;
        let lockedAngle = null;
        // 셰일 광물 입자 위치 고정
        let shaleMineralParticles = [];
        function initializeShaleParticles(radius) {
            shaleMineralParticles = [];
            for(let i=0; i<120; i++) { // 입자 수 약간 증가
                shaleMineralParticles.push({
                    x: (Math.random()-0.5)*radius*1.8, // 원 안쪽에 퍼지도록 조정
                    y: (Math.random()-0.5)*radius*1.8,
                    r: Math.random()*2.5+1
                });
            }
        }
        // 초기화 (페이지 로드 시 즉시 실행)
        initializeShaleParticles(ROCK_RADIUS);
        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        // 암석 렌더링 함수
        function drawRock(ctx, x, y, radius, pressureLevel, angle) {
            ctx.save();
            ctx.translate(x, y);
            // 압력 방향의 수직(엽리 방향)으로 회전 (방향이 고정되었을 때만)
            if (angle !== null) {
                ctx.rotate(angle + Math.PI / 2);
            }
            // [1] 암석 바탕(원형) - 모든 단계 공통
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, 2 * Math.PI);
            // 압력에 따른 배경색 변화
            const bgIntensity = Math.floor(130 - (pressureLevel * 80));
            ctx.fillStyle = `rgb(${bgIntensity}, ${bgIntensity}, ${bgIntensity + 10})`;
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#333';
            ctx.stroke();
            ctx.clip(); // 원 안쪽으로만 조직을 그리기 위해 클리핑
            // [2] 압력 단계별 암석 조직 그리기
            // 셰일 (미변성) - 낮은 압력 또는 방향 고정 전
            if (pressureLevel < 0.2 || angle === null) {
                rockNameEl.innerText = "셰일 (Shale) - 방향성 없음";
                rockNameEl.style.color = "#a0a0a0";
                // 고정된 무작위 점토 광물 무늬
                ctx.fillStyle = "rgba(70, 70, 70, 0.8)";
                shaleMineralParticles.forEach(particle => {
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, particle.r, 0, Math.PI*2);
                    ctx.fill();
                });
            } else if (pressureLevel < 0.5) {
                rockNameEl.innerText = "슬레이트/천매암 - 얇은 편리";
                rockNameEl.style.color = "#4db8ff";
                ctx.strokeStyle = "rgba(255,255,255,0.3)";
                ctx.lineWidth = 1.2;
                for(let i=-radius; i<radius; i+=10) {
                    ctx.beginPath();
                    ctx.moveTo(-radius * 1.5, i + (Math.random()*3-1.5));
                    ctx.lineTo(radius * 1.5, i + (Math.random()*3-1.5));
                    ctx.stroke();
                }
            } else if (pressureLevel < 0.8) {
                rockNameEl.innerText = "편암 (Schist) - 뚜렷한 편리";
                rockNameEl.style.color = "#ffeb3b";
                ctx.lineWidth = 3.5;
                for(let i=-radius*1.2; i<radius*1.2; i+=15) {
                    // 밝고 어두운 선 혼합
                    ctx.strokeStyle = (i%30 === 0) ? "rgba(255,255,255,0.7)" : "rgba(20,20,20,0.6)";
                    ctx.beginPath();
                    ctx.moveTo(-radius * 1.5, i);
                    // 약간의 굴곡 추가 (편리)
                    ctx.quadraticCurveTo(0, i + (Math.random()*25-12.5), radius * 1.5, i);
                    ctx.stroke();
                }
            } else {
                rockNameEl.innerText = "편마암 (Gneiss) - 편마 구조";
                rockNameEl.style.color = "#ff5722";
                ctx.lineWidth = 14; // 두꺼운 띠
                for(let i=-radius*1.5; i<radius*1.5; i+=22) {
                    // 밝은 띠(석영, 장석)와 어두운 띠(흑운모, 각섬석) 교차
                    ctx.strokeStyle = (i%44 === 0) ? "#fcfcf0" : "#050505";
                    ctx.beginPath();
                    ctx.moveTo(-radius * 1.5, i);
                    // 굵은 굴곡 (편마 구조)
                    ctx.bezierCurveTo(-radius/2, i+18, radius/2, i-18, radius * 1.5, i);
                    ctx.stroke();
                }
            }
            ctx.restore(); // 클리핑 및 회전 해제
        }
        function onResults(results) {
            // 매 프레임 캔버스를 깨끗이 지웁니다 (비디오 위에 렌더링 위해)
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            let numHands = 0;
            if (results.multiHandLandmarks) {
                numHands = results.multiHandLandmarks.length;
            }
            if (numHands === 0) {
                // 손이 인식되지 않음
                notificationEl.innerText = "양손을 화면에 띄워주세요!";
                notificationEl.style.display = "block";
                pressure = Math.max(0, pressure - 0.05); // 압력 자연스럽게 감소
                if(pressure === 0) lockedAngle = null;
            } else if (numHands === 1) {
                // 한 손만 인식됨
                notificationEl.innerText = "양손을 모두 보여주세요! (두 손을 서서히 모으세요)";
                notificationEl.style.display = "block";
                pressure = Math.max(0, pressure - 0.02); // 압력 미세 감소
            } else {
                // 양손 모두 인식됨
                notificationEl.style.display = "none"; // 알림 숨김
                // 거리를 거울모드 기준으로 다시 계산하기 위해 좌우 반전 복원
                const h1 = results.multiHandLandmarks[0][9];
                const h2 = results.multiHandLandmarks[1][9];
                // 인식된 손 좌표를 캔버스 실제 크기로 변환
                const h1X = h1.x * canvasElement.width;
                const h1Y = h1.y * canvasElement.height;
                const h2X = h2.x * canvasElement.width;
                const h2Y = h2.y * canvasElement.height;
                // 손 위치 시각화 (녹색 점)
                canvasCtx.fillStyle = 'rgba(0, 255, 0, 0.6)';
                canvasCtx.beginPath(); canvasCtx.arc(h1X, h1Y, 15, 0, 2*Math.PI); canvasCtx.fill();
                canvasCtx.beginPath(); canvasCtx.arc(h2X, h2Y, 15, 0, 2*Math.PI); canvasCtx.fill();
                // 압력 방향 시각화 (빨간 선)
                canvasCtx.strokeStyle = 'rgba(255, 0, 0, 0.5)';
                canvasCtx.lineWidth = 6;
                canvasCtx.beginPath();
                canvasCtx.moveTo(h1X, h1Y);
                canvasCtx.lineTo(h2X, h2Y);
                canvasCtx.stroke();
                // [핵심] 거리 계산 및 압력 치환
                // dx 계산 시, MediaPipe 원본 좌표(h1.x)를 사용하여 반전으로 인한 혼란 방지
                const dx = h1.x - h2.x;
                const dy = h1.y - h2.y;
                const distance = Math.sqrt(dx*dx + dy*dy);
                // 반응 범위 확대 (더 민감하게)
                const MAX_DIST = 0.75; // 이 거리보다 멀면 압력 0
                const MIN_DIST = 0.08; // 이 거리보다 가까우면 압력 1
                let rawPressure = 1 - ((distance - MIN_DIST) / (MAX_DIST - MIN_DIST));
                pressure = Math.max(0, Math.min(1, rawPressure));
                // 압력이 막 가해지기 시작할 때 방향 고정 (한 번 고정되면 계속 유지)
                if (pressure > 0.1) {
                    if (lockedAngle === null) {
                        // 빨간 선 방향의 각도 계산
                        lockedAngle = Math.atan2(dy, dx);
                    }
                }
            }
            // UI 및 암석 업데이트
            pressureBarEl.style.width = `${pressure * 100}%`;
            // 화면 중앙에 암석 그리기 (손 상태와 무관하게 매 프레임 그리기 보장)
            const centerX = canvasElement.width / 2;
            const centerY = canvasElement.height / 2;
            drawRock(canvasCtx, centerX, centerY, ROCK_RADIUS, pressure, lockedAngle);
        }
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1, // 성능과 정확도 균형
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        hands.onResults(onResults);
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });
        camera.start();
    </script>
</body>
</html>
